//file:noinspection GroovyAssignabilityCheck
plugins {
    id "com.gradleup.shadow" version "9.5.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    commonCompile {
        canBeResolved = true
        canBeConsumed = false
    }
    commonRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom commonCompile
    runtimeClasspath.extendsFrom commonRuntime
    developmentFabric.extendsFrom commonRuntime

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    commonCompile(project(path: ":common", configuration: "apiElements")) { transitive = false }
    commonRuntime(project(path: ":common", configuration: "runtimeElements")) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'apiElements')
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ""
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

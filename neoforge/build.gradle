//file:noinspection GroovyAssignabilityCheck
plugins {
    id "com.gradleup.shadow" version "9.5.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    commonCompile {
        canBeResolved = true
        canBeConsumed = false
    }
    commonRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom commonCompile
    runtimeClasspath.extendsFrom commonRuntime
    developmentNeoForge.extendsFrom commonRuntime

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    commonCompile(project(path: ":common", configuration: "apiElements")) { transitive = false }
    commonRuntime(project(path: ":common", configuration: "runtimeElements")) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'apiElements')
}

processResources {
    duplicatesStrategy "exclude"
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ""
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
